<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALBA RADIO</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --yellow-accent: #facc15;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #334155;
    --danger: #ef4444;
    --ok: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }

  .alba-wrap {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 12px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 100%;
  }

  .player {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 780px;
    padding: 16px 20px;
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.12), 0 8px 20px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
  }

  .title-area { text-align: center; margin-bottom: 12px; }
  .title-area h2 { font-size: 1.25rem; font-weight: 700; color: var(--accent); line-height: 1.2; letter-spacing: 0.06em; }
  .subtitle-1 { color: var(--text); font-size: 0.85rem; font-weight: 500; margin-top: 3px; }
  .subtitle-2 { color: var(--yellow-accent); font-size: 0.8rem; font-weight: 600; margin-top: 2px; }
  .location-clock { color: var(--muted); font-size: 0.78rem; font-weight: 500; margin-top: 3px; }
  .location-clock strong { color: var(--accent); font-variant-numeric: tabular-nums; }

  .up-next-banner {
    background: rgba(56, 189, 248, 0.08);
    border: 1px dashed rgba(56, 189, 248, 0.3);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 8px;
  }
  .up-next-banner strong { color: var(--text); }

  .now-playing-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .track-details-container { display: flex; align-items: center; gap: 12px; width: 100%; }
  .station-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(56, 189, 248, 0.1);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; flex-shrink: 0;
  }

  .track-info { flex: 1; overflow: hidden; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(239, 68, 68, 0.15); color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.4);
    font-size: 0.65rem; font-weight: 700;
    padding: 2px 6px; border-radius: 10px;
    text-transform: uppercase; margin-bottom: 2px;
  }

  .pulse-dot { width: 5px; height: 5px; background-color: var(--danger); border-radius: 50%; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.8)} 100%{opacity:1;transform:scale(1)} }

  .track-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta { color: var(--muted); font-size: 0.78rem; }

  .progress-bar-container { width: 100%; background: rgba(255,255,255,0.08); height: 4px; border-radius: 2px; overflow: hidden; }
  .progress-fill { background: var(--accent); height: 100%; width: 0%; transition: width 0.4s linear; }

  .audio-controls-row { display: flex; align-items: center; gap: 10px; width: 100%; }

  .start-btn {
    width: 100%; background: var(--accent); color: #04121f; border: none;
    padding: 9px; border-radius: 6px; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; letter-spacing: 0.02em;
  }
  .start-btn:hover { filter: brightness(1.08); }

  .toggle-audio-btn {
    flex: 1; background: rgba(255,255,255,0.08); color: var(--text);
    border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px;
    font-weight: 600; font-size: 0.78rem; cursor: pointer;
  }

  .volume-container {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    padding: 4px 8px; border-radius: 6px;
  }
  .volume-container input[type="range"] { width: 80px; accent-color: var(--accent); cursor: pointer; }

  .hidden { display: none !important; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--yellow-accent); outline-offset: 2px; }

  .playlist-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.72rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
  }

  .playlist {
    list-style: none; max-height: 230px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px;
    scroll-behavior: smooth;
  }

  .playlist-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); gap: 10px; }
  .playlist-item:last-child { border-bottom: none; }
  .playlist-item.active { background: rgba(56,189,248,0.12); border-left: 3px solid var(--accent); }
  .playlist-item.past { opacity: 0.45; }

  .item-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item-title { font-size: 0.82rem; font-weight: 500; }
  .item-schedule-time { font-size: 0.72rem; color: var(--accent); background: rgba(56,189,248,0.1); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, monospace; }
  .item-sub { font-size: 0.72rem; color: var(--muted); display: block; }
  .item-duration { font-size: 0.75rem; color: var(--muted); font-family: ui-monospace, monospace; white-space: nowrap; }

  .visualizer-container {
    background: rgba(0,0,0,0.3); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px;
  }
  .visualizer-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.68rem; font-weight: 700; color: var(--yellow-accent); text-transform: uppercase; }
  .visualizer-bars { display: flex; align-items: flex-end; justify-content: space-between; height: 24px; gap: 4px; }
  .bar { flex: 1; background-color: var(--yellow-accent); border-radius: 2px 2px 0 0; height: 10%; box-shadow: 0 0 6px rgba(250,204,21,0.3); }

  .visualizer-bars.playing .bar { animation: beat 0.8s ease-in-out infinite alternate; }
  .visualizer-bars.playing .bar:nth-child(1){animation-delay:.10s;animation-duration:.6s}
  .visualizer-bars.playing .bar:nth-child(2){animation-delay:.30s;animation-duration:.9s}
  .visualizer-bars.playing .bar:nth-child(3){animation-delay:.00s;animation-duration:.5s}
  .visualizer-bars.playing .bar:nth-child(4){animation-delay:.40s;animation-duration:.7s}
  .visualizer-bars.playing .bar:nth-child(5){animation-delay:.20s;animation-duration:.8s}
  .visualizer-bars.playing .bar:nth-child(6){animation-delay:.50s;animation-duration:.6s}
  .visualizer-bars.playing .bar:nth-child(7){animation-delay:.15s;animation-duration:1.0s}
  .visualizer-bars.playing .bar:nth-child(8){animation-delay:.35s;animation-duration:.4s}
  .visualizer-bars.playing .bar:nth-child(9){animation-delay:.25s;animation-duration:.7s}
  .visualizer-bars.playing .bar:nth-child(10){animation-delay:.05s;animation-duration:.9s}
  @keyframes beat { 0%{height:15%} 50%{height:100%} 100%{height:25%} }

  /* --- diagnostics --- */
  .diag-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .diag-btn {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 4px 9px; border-radius: 5px; font-size: 0.7rem; font-weight: 600; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .diag-btn:hover { color: var(--text); border-color: var(--accent); }

  .diag-panel {
    margin-top: 8px; border: 1px solid var(--border); border-radius: 6px;
    background: rgba(0,0,0,0.35); padding: 8px 10px;
  }
  .diag-log {
    font-family: ui-monospace, monospace; font-size: 0.68rem; line-height: 1.55;
    color: var(--muted); max-height: 180px; overflow-y: auto; white-space: pre-wrap;
  }
  .diag-log .ok { color: var(--ok); }
  .diag-log .bad { color: var(--danger); }
  .diag-log .note { color: var(--yellow-accent); }
  .diag-actions { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) {
    .visualizer-bars.playing .bar { animation: none; height: 45%; }
    .pulse-dot { animation: none; }
    .progress-fill { transition: none; }
  }
</style>
</head>
<body>

<div class="alba-wrap">
<div class="player">
  <div class="title-area">
    <h2>ALBA RADIO</h2>
    <div class="subtitle-1">The Platform of Students and Academics</div>
    <div class="subtitle-2">Daily program starts at 08:00</div>
    <div class="location-clock">Durrës &middot; <strong id="durres-date">--/--/----</strong> &middot; <strong id="durres-time">--:--:--</strong></div>
    <div class="up-next-banner" id="up-next-banner">Up next: <strong>Reading schedule&hellip;</strong></div>
  </div>

  <audio id="audio" preload="none" playsinline></audio>

  <div class="now-playing-card">
    <div class="track-details-container">
      <div class="station-icon">📻</div>
      <div class="track-info">
        <div class="badge" id="cat-badge"><span class="pulse-dot"></span><span id="cat">LIVE RADIO</span></div>
        <div class="track-name" id="title">Reading schedule&hellip;</div>
        <div class="track-meta" id="artist">ALBA Radio Network</div>
      </div>
    </div>

    <div class="progress-bar-container"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="audio-controls-row">
      <button class="start-btn" id="start-btn" type="button">▶ Start live broadcast</button>
      <button class="toggle-audio-btn hidden" id="toggle-audio-btn" type="button">🔊 Mute</button>
      <div class="volume-container hidden" id="volume-container">
        <span style="font-size:0.75rem;">🔈</span>
        <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      </div>
    </div>
  </div>

  <div class="playlist-header">
    <span>Today's program &amp; schedule</span>
    <span>Length</span>
  </div>
  <ul class="playlist" id="playlist"></ul>

  <div class="visualizer-container">
    <div class="visualizer-header">
      <span>Audio rhythm monitor</span>
      <span id="bass-status" style="font-size:0.62rem;color:var(--muted);">STANDBY</span>
    </div>
    <div class="visualizer-bars" id="v-bars">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="diag-bar">
    <span style="font-size:0.7rem;color:var(--muted);" id="short-status">Waiting to start</span>
    <button class="diag-btn" id="diag-toggle" type="button">Diagnostics</button>
  </div>

  <div class="diag-panel hidden" id="diag-panel">
    <div class="diag-actions">
      <button class="diag-btn" id="test-btn" type="button">Test all audio files</button>
      <button class="diag-btn" id="clear-btn" type="button">Clear log</button>
    </div>
    <div class="diag-log" id="diag-log"></div>
  </div>
</div>
</div>

<script>
(function () {
  "use strict";

  /* ============================================================
     1. CONFIGURATION
     ============================================================ */
  var CONFIG = {
    timeZone:       "Europe/Tirane",
    dayStartHour:   8,
    probeTimeoutMs: 9000,
    probeConcurrency: 2,    // never saturate the 6-connection-per-host budget
    probeDelayMs:   4000    // start probing only after the first track is playing
  };

  var LIBRARY = [
    { id:"m1", title:"ABBA",                              artist:"Pop / Disco",       category:"Album", defaultDur: 4531, src:"https://archive.org/download/george-benson_20260813/ABBA.mp3" },
    { id:"m2", title:"ALAN PARSONS PROJECT",              artist:"Prog Rock",         category:"Album", defaultDur: 3593, src:"https://archive.org/download/george-benson_20260813/Alan%20Parsons%20Project.mp3" },
    { id:"m3", title:"BEATLES",                           artist:"Classic Rock",      category:"Album", defaultDur: 3869, src:"https://archive.org/download/george-benson_20260813/Beatles.mp3" },
    { id:"m4", title:"BEE GEES - GREATEST HITS",          artist:"Disco Classics",    category:"Album", defaultDur: 3010, src:"https://archive.org/download/george-benson_20260813/Bee%20Gees%20Greatest%20Hits.mp3" },
    { id:"m5", title:"BEST SONGS OF THE 1980s",           artist:"80s Pop",           category:"Album", defaultDur: 6813, src:"https://archive.org/download/george-benson_20260813/Best%20Songs1980s.mp3" },
    { id:"m6", title:"CHANSONS FRANÇAISES",               artist:"French Classics",   category:"Album", defaultDur: 5823, src:"https://archive.org/download/george-benson_20260813/Chansons%20Fran%C3%A7aises.mp3" },
    { id:"m7", title:"CLASSIC FOLK ROCK",                 artist:"Folk Rock",         category:"Album", defaultDur: 5862, src:"https://archive.org/download/george-benson_20260813/Classic%20Folk%20Rock.mp3" },
    { id:"m8", title:"CLASSIC ROCK 70s 80s 90s",          artist:"Classic Rock",      category:"Album", defaultDur: 5934, src:"https://archive.org/download/george-benson_20260813/Classic%20Rock%20Songs%2070s%2080s%2090s.mp3" },
    { id:"m9", title:"DIONNE WARWICK",                    artist:"Soul / Pop",        category:"Album", defaultDur: 7351, src:"https://archive.org/download/george-benson_20260813/Dionne%20Warwick.mp3" },
    { id:"m10", title:"FOLK SONGS 70's - TAYLOR & CROCE",  artist:"Folk",              category:"Album", defaultDur: 4603, src:"https://archive.org/download/george-benson_20260813/Folk%20Songs%2070%27s%20-%20James%20Taylor%20%26%20Jim%20Croce.mp3" },
    { id:"m11", title:"GEORGE BENSON",                     artist:"Soul / Jazz",       category:"Album", defaultDur: 8616, src:"https://archive.org/download/george-benson_20260813/George%20Benson.mp3" },
    { id:"m12", title:"GEORGE HARRISON",                   artist:"Classic Rock",      category:"Album", defaultDur: 2610, src:"https://archive.org/download/george-benson_20260813/George%20Harrison.mp3" },
    { id:"m13", title:"GOLDEN OLDIES 50s 60s 70s",         artist:"Classic Oldies",    category:"Album", defaultDur: 5547, src:"https://archive.org/download/george-benson_20260813/Golden%20Oldies%2050s%2060s%2070s%20Hits.mp3" },
    { id:"m14", title:"GOLDEN OLDIES - GREATEST HITS",     artist:"Classic Oldies",    category:"Album", defaultDur: 3515, src:"https://archive.org/download/george-benson_20260813/Golden%20Oldies%20Greatest%20Hits.mp3" },
    { id:"m15", title:"JIM CROCE",                         artist:"Folk Rock",         category:"Album", defaultDur: 2584, src:"https://archive.org/download/george-benson_20260813/Jim%20Croce.mp3" }
  ];

  /* ============================================================
     2. ELEMENTS
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };

  var audio = $("audio");
  var elTitle = $("title"), elArtist = $("artist"), elCat = $("cat");
  var elPlaylist = $("playlist");
  var startBtn = $("start-btn"), muteBtn = $("toggle-audio-btn");
  var volBox = $("volume-container"), volSlider = $("vol-slider");
  var progressFill = $("progress-fill"), upNext = $("up-next-banner");
  var vBars = $("v-bars"), bassStatus = $("bass-status");
  var elDate = $("durres-date"), elTime = $("durres-time");
  var shortStatus = $("short-status");
  var diagPanel = $("diag-panel"), diagLog = $("diag-log");

  /* ============================================================
     3. STATE
     ============================================================ */
  var durations = {}, schedule = [], broken = {}, retried = {};
  var currentIndex = -1, scheduleDay = null;
  var started = false, userVolume = 1;
  var pendingSeek = 0, probeStarted = false;
  var DAY = 86400;

  /* ============================================================
     4. DIAGNOSTIC LOG
     ============================================================ */
  function log(msg, kind) {
    var line = document.createElement("div");
    if (kind) line.className = kind;
    var t = new Date();
    line.textContent = "[" + pad(t.getHours()) + ":" + pad(t.getMinutes()) + ":" + pad(t.getSeconds()) + "] " + msg;
    diagLog.appendChild(line);
    diagLog.scrollTop = diagLog.scrollHeight;
  }

  var MEDIA_ERR = {
    1: "ABORTED — load cancelled",
    2: "NETWORK — connection failed or blocked",
    3: "DECODE — file is corrupt or not a valid MP3",
    4: "SRC_NOT_SUPPORTED — URL is wrong (404) or the format is unsupported"
  };

  function errText(el) {
    if (!el.error) return "unknown error";
    return (MEDIA_ERR[el.error.code] || ("code " + el.error.code));
  }

  /* ============================================================
     5. STATION CLOCK
     ============================================================ */
  var partsFmt = new Intl.DateTimeFormat("en-GB", {
    timeZone: CONFIG.timeZone, hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });

  function stationParts() {
    var out = {}, arr = partsFmt.formatToParts(new Date());
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].type !== "literal") out[arr[i].type] = parseInt(arr[i].value, 10);
    }
    if (out.hour === 24) out.hour = 0;
    return out;
  }

  function secsOfDay(p) { return p.hour * 3600 + p.minute * 60 + p.second; }
  function elapsedSinceOpen(p) { return (secsOfDay(p) - CONFIG.dayStartHour * 3600 + DAY) % DAY; }

  function programDayKey(p) {
    var t = Date.UTC(p.year, p.month - 1, p.day);
    if (p.hour < CONFIG.dayStartHour) t -= DAY * 1000;
    var d = new Date(t);
    return d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate();
  }

  /* ============================================================
     6. FORMATTING
     ============================================================ */
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function fmtLength(s) {
    if (!s || isNaN(s)) return "--:--";
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return h > 0 ? h + ":" + pad(m) + ":" + pad(sec) : pad(m) + ":" + pad(sec);
  }

  function fmtClock(sec) {
    var s = ((sec % DAY) + DAY) % DAY;
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60));
  }

  /* ============================================================
     7. SCHEDULE
     ============================================================ */
  function playable() {
    var out = [];
    for (var i = 0; i < LIBRARY.length; i++) if (!broken[LIBRARY[i].id]) out.push(LIBRARY[i]);
    return out;
  }

  function shuffleForDay(dayKey, pool) {
    var seed = dayKey, p = pool.slice(), out = [];
    while (p.length) {
      seed = (seed * 9301 + 49297) % 233280;
      out.push(p.splice(Math.floor((seed / 233280) * p.length), 1)[0]);
    }
    return out;
  }

  function buildSchedule(dayKey) {
    var pool = playable();
    schedule = [];

    if (!pool.length) {
      elTitle.textContent = "No playable audio files";
      elArtist.textContent = "Open Diagnostics and run \u201CTest all audio files\u201D";
      elPlaylist.innerHTML = "";
      scheduleDay = dayKey;
      return;
    }

    // The library is shorter than 24h, so albums repeat. Each repeat pass is
    // reshuffled with its own seed, otherwise the small hours would simply
    // replay the morning in the same order.
    var offset = 0, pass = 0, order = [], i = 0, lastId = null;

    while (offset < DAY) {
      if (i >= order.length) {
        order = shuffleForDay(dayKey + pass * 7919, pool);
        // never open a pass with the album that has just finished
        if (order.length > 1 && order[0].id === lastId) order.push(order.shift());
        i = 0;
        pass++;
      }

      var item = order[i++];
      var dur = durations[item.id] || item.defaultDur;
      var slot = Math.min(dur, DAY - offset);
      if (slot < 60) break;

      schedule.push({
        id: item.id, title: item.title, artist: item.artist,
        category: item.category, src: item.src,
        start: offset, dur: slot, repeat: pass > 1
      });
      offset += slot;
      lastId = item.id;
    }

    // Absorb any leftover seconds into the final slot so the day has no gap.
    if (schedule.length && offset < DAY) schedule[schedule.length - 1].dur += DAY - offset;

    scheduleDay = dayKey;
    currentIndex = -1;
    renderPlaylist();
  }

  function renderPlaylist() {
    var html = "";
    for (var i = 0; i < schedule.length; i++) {
      var it = schedule[i];
      var startClock = CONFIG.dayStartHour * 3600 + it.start;
      var cls = "playlist-item" + (i === currentIndex ? " active" : (i < currentIndex ? " past" : ""));
      html += '<li class="' + cls + '" id="pl-' + i + '"><div><div class="item-title-row">' +
              '<span class="item-title">' + it.title + '</span>' +
              '<span class="item-schedule-time">' + fmtClock(startClock) + " \u2013 " + fmtClock(startClock + it.dur) + '</span>' +
              '</div><span class="item-sub">' + it.artist + (it.repeat ? " \u00B7 repeat" : "") + '</span></div>' +
              '<span class="item-duration">' + fmtLength(it.dur) + '</span></li>';
    }
    elPlaylist.innerHTML = html;
  }

  /* ============================================================
     8. URL REPAIR
        archive.org filenames with spaces must be %20, not +.
        If a "+" URL fails we retry the %20 form once before
        declaring the file dead.
     ============================================================ */
  function altUrl(src) {
    return src.indexOf("+") === -1 ? null : src.split("+").join("%20");
  }

  /* ============================================================
     9. PLAYBACK
     ============================================================ */
  function loadSlot(index, offsetSeconds) {
    var it = schedule[index];
    if (!it) return;

    pendingSeek = offsetSeconds;

    if (audio.getAttribute("src") !== it.src) {
      audio.setAttribute("src", it.src);
      audio.preload = "auto";
      audio.load();
      log("Loading: " + it.title);
    } else if (audio.readyState >= 1) {
      seekNow();
    }

    elTitle.textContent = it.title;
    elArtist.textContent = it.artist;
    elCat.textContent = it.category;

    renderPlaylist();
    var row = $("pl-" + index);
    if (row) row.scrollIntoView({ block: "nearest" });

    if (started) tryPlay();
  }

  function seekNow() {
    if (pendingSeek > 0 && isFinite(audio.duration) && pendingSeek < audio.duration - 1) {
      try { audio.currentTime = pendingSeek; } catch (e) { log("Seek refused: " + e.message, "bad"); }
    }
    pendingSeek = 0;
  }

  audio.addEventListener("loadedmetadata", function () {
    var it = schedule[currentIndex];
    if (it && isFinite(audio.duration) && audio.duration > 1) {
      var real = Math.floor(audio.duration);
      if (!durations[it.id]) {
        durations[it.id] = real;
        log("Length of " + it.title + ": " + fmtLength(real), "ok");
      }
    }
    seekNow();
  });

  function tryPlay() {
    var p = audio.play();
    if (p && p.catch) {
      p.then(function () { log("Playing.", "ok"); paint(); })
       .catch(function (e) {
         started = false;
         showStartButton();
         log("Playback blocked: " + e.name + " \u2014 press Start.", "note");
         paint();
       });
    }
  }

  /* ---- failure handling: repair, then skip, never freeze ---- */
  audio.addEventListener("error", function () {
    var it = schedule[currentIndex];
    var reason = errText(audio);

    if (!it) { log("Audio error with no slot: " + reason, "bad"); return; }

    var alt = altUrl(it.src);
    if (alt && !retried[it.id]) {
      retried[it.id] = true;
      log(it.title + " failed (" + reason + ") \u2014 retrying with %20 URL", "note");
      for (var k = 0; k < LIBRARY.length; k++) if (LIBRARY[k].id === it.id) LIBRARY[k].src = alt;
      it.src = alt;
      audio.setAttribute("src", alt);
      audio.load();
      if (started) tryPlay();
      return;
    }

    broken[it.id] = true;
    log(it.title + " removed from rotation: " + reason, "bad");
    buildSchedule(scheduleDay);   // rebuild without it; tick() picks the next slot
    tick();
  });

  /* ============================================================
     10. ONE-SECOND LOOP
     ============================================================ */
  function tick() {
    var p = stationParts();
    elDate.textContent = pad(p.day) + "/" + pad(p.month) + "/" + p.year;
    elTime.textContent = pad(p.hour) + ":" + pad(p.minute) + ":" + pad(p.second);

    var key = programDayKey(p);
    if (key !== scheduleDay) buildSchedule(key);
    if (!schedule.length) return;

    var elapsed = elapsedSinceOpen(p);
    var target = -1, offset = 0;
    for (var i = 0; i < schedule.length; i++) {
      if (elapsed >= schedule[i].start && elapsed < schedule[i].start + schedule[i].dur) {
        target = i; offset = elapsed - schedule[i].start; break;
      }
    }
    if (target === -1) { paint(); return; }

    if (target !== currentIndex) {
      currentIndex = target;
      loadSlot(target, offset);
    }

    progressFill.style.width = ((offset / schedule[target].dur) * 100).toFixed(2) + "%";

    var nx = schedule[currentIndex + 1];
    upNext.innerHTML = nx
      ? "Up next: <strong>" + nx.title + "</strong> at " + fmtClock(CONFIG.dayStartHour * 3600 + nx.start)
      : "Up next: <strong>New program at 08:00</strong>";

    paint();
  }

  /* ============================================================
     11. UI STATE
     ============================================================ */
  function showStartButton() {
    startBtn.classList.remove("hidden");
    muteBtn.classList.add("hidden");
    volBox.classList.add("hidden");
  }

  function showPlayingControls() {
    startBtn.classList.add("hidden");
    muteBtn.classList.remove("hidden");
    volBox.classList.remove("hidden");
  }

  var NET = ["EMPTY", "IDLE", "LOADING", "NO SOURCE"];
  var READY = ["nothing", "metadata", "current data", "future data", "enough data"];

  function paint() {
    muteBtn.textContent = audio.muted ? "🔇 Unmute" : "🔊 Mute";
    muteBtn.style.borderColor = audio.muted ? "var(--danger)" : "var(--border)";

    var onAir = started && !audio.paused && !audio.muted;

    if (onAir) {
      vBars.classList.add("playing");
      bassStatus.textContent = "LIVE BEAT";
      bassStatus.style.color = "var(--yellow-accent)";
    } else {
      vBars.classList.remove("playing");
      bassStatus.textContent = !started ? "STANDBY" : (audio.muted ? "MUTED" : "BUFFERING");
      bassStatus.style.color = "var(--muted)";
    }

    shortStatus.textContent =
      (started ? (audio.paused ? "Paused" : "On air") : "Waiting to start") +
      " \u00B7 network " + (NET[audio.networkState] || audio.networkState) +
      " \u00B7 has " + (READY[audio.readyState] || audio.readyState);
  }

  /* ============================================================
     12. FILE TESTER (diagnostics)
     ============================================================ */
  function probeOne(item) {
    return new Promise(function (resolve) {
      var probe = new Audio(), done = false;
      function finish(res) {
        if (done) return;
        done = true;
        probe.removeAttribute("src");
        try { probe.load(); } catch (e) {}
        resolve(res);
      }
      probe.preload = "metadata";
      probe.addEventListener("loadedmetadata", function () {
        finish({ id: item.id, ok: true, dur: Math.floor(probe.duration), title: item.title });
      });
      probe.addEventListener("error", function () {
        finish({ id: item.id, ok: false, why: errText(probe), title: item.title, src: item.src });
      });
      setTimeout(function () { finish({ id: item.id, ok: false, why: "TIMEOUT", title: item.title, src: item.src }); }, CONFIG.probeTimeoutMs);
      probe.src = item.src;
    });
  }

  // Sequential-with-small-pool. Running all 16 at once starves the main
  // audio element: browsers allow only ~6 connections per host.
  function runPool(items, limit, onResult) {
    return new Promise(function (resolve) {
      var next = 0, active = 0;
      function pump() {
        if (next >= items.length && active === 0) return resolve();
        while (active < limit && next < items.length) {
          var item = items[next++];
          active++;
          probeOne(item).then(function (res) {
            active--;
            if (onResult) onResult(res);
            pump();
          });
        }
      }
      pump();
    });
  }

  function testAll(applyResults) {
    log("Testing " + LIBRARY.length + " files, " + CONFIG.probeConcurrency + " at a time\u2026", "note");
    var failures = 0;
    return runPool(LIBRARY, CONFIG.probeConcurrency, function (res) {
      if (res.ok) {
        log("OK   " + res.title + "  (" + fmtLength(res.dur) + ")", "ok");
        if (applyResults) durations[res.id] = res.dur;
      } else {
        failures++;
        log("FAIL " + res.title + "  \u2014 " + res.why, "bad");
        log("     " + res.src, "bad");
      }
    }).then(function () {
      log(failures ? (failures + " file(s) failed. Paste a failing URL into a browser tab to confirm.")
                   : "All files reachable.", failures ? "bad" : "ok");
      if (applyResults) { buildSchedule(programDayKey(stationParts())); tick(); }
    });
  }

  /* ============================================================
     13. CONTROLS
     ============================================================ */
  startBtn.addEventListener("click", function () {
    started = true;
    audio.muted = false;
    audio.volume = userVolume;
    showPlayingControls();

    var elapsed = elapsedSinceOpen(stationParts());
    var it = schedule[currentIndex];
    if (it) {
      pendingSeek = elapsed - it.start;
      if (audio.readyState >= 1) seekNow();
    }
    tryPlay();

    // Learn the real file lengths only once audio is already flowing.
    if (!probeStarted) {
      probeStarted = true;
      setTimeout(function () { testAll(true); }, CONFIG.probeDelayMs);
    }
  });

  muteBtn.addEventListener("click", function () {
    audio.muted = !audio.muted;
    paint();
  });

  volSlider.addEventListener("input", function (e) {
    userVolume = parseFloat(e.target.value);
    audio.volume = userVolume;
  });

  $("diag-toggle").addEventListener("click", function () { diagPanel.classList.toggle("hidden"); });
  $("test-btn").addEventListener("click", function () { testAll(false); });
  $("clear-btn").addEventListener("click", function () { diagLog.innerHTML = ""; });

  audio.addEventListener("playing", paint);
  audio.addEventListener("pause", paint);
  audio.addEventListener("waiting", function () { log("Buffering\u2026"); paint(); });
  audio.addEventListener("stalled", function () { log("Stalled \u2014 no data arriving", "note"); });

  /* ============================================================
     14. BOOT
     ============================================================ */
  for (var i = 0; i < LIBRARY.length; i++) durations[LIBRARY[i].id] = 0;

  log("Station time zone: " + CONFIG.timeZone);
  log("Library: " + LIBRARY.length + " files. Press Start to go on air.");

  buildSchedule(programDayKey(stationParts()));
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
